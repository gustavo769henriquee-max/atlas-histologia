name: Deploy to GitHub Pages

# Publica o frontend no GitHub Pages sempre que há push para a branch
# principal. A build consome as variáveis de ambiente VITE_SUPABASE_URL
# e VITE_SUPABASE_PUBLISHABLE_KEY definidas como segredos do repositório.
#
# Observação: a publishable key é pública por design (anon key) e NÃO é
# a service_role key. Nunca versionar a service_role key.

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

